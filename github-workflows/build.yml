# Compilation de verification : a chaque push, on fabrique le .exe
# pour verifier que le code compile. L'exe est dispo en "artifact"
# en bas de la page du run (onglet Actions du repo).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Lire la version (version.txt)
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version : $v"

      - name: Fabriquer GameExe.exe (un seul fichier autonome)
        shell: pwsh
        run: >
          dotnet publish src/GameExe/GameExe.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$env:VERSION
          -p:InformationalVersion=$env:VERSION
          -o dist

      - name: Publier l'exe comme artifact telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: GameExe-win-x64
          path: dist/GameExe.exe
